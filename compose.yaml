services:
  dapan-cloud:
    build:
      context: .
      args:
        NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-http://localhost:3000}
    restart: unless-stopped
    init: true
    ports:
      - "${APP_BIND_HOST:-127.0.0.1}:${APP_PORT:-3000}:3000"
    environment:
      MARKET_DATA_PROVIDER: ${MARKET_DATA_PROVIDER:-auto}
      MARKET_CACHE_SECONDS: ${MARKET_CACHE_SECONDS:-15}
      NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-http://localhost:3000}
      NEXT_TELEMETRY_DISABLED: "1"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

<svg xmlns="http://www.w3.org/2000/svg" width="34" height="34" viewBox="0 0 34 34" role="img" aria-label="大盘云图">
  <title>大盘云图</title>
  <!-- 云图方块：矩形树图（treemap）意象，块面积表达权重、红绿表达涨跌 -->
  <g>
    <rect x="2" y="2" width="18" height="15" rx="1.7" fill="#ef4444"/>
    <rect x="23" y="2" width="9" height="15" rx="1.7" fill="#f87171"/>
    <rect x="2" y="20" width="9" height="12" rx="1.7" fill="#22c55e"/>
    <rect x="14" y="20" width="8" height="12" rx="1.7" fill="#fca5a5"/>
    <rect x="25" y="20" width="7" height="12" rx="1.7" fill="#64748b"/>
  </g>
</svg>
